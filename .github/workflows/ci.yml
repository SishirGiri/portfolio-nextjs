name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test
        env:
          GAME_AUTH_SECRET: ci-secret-for-tests-only

      - name: Build
        run: npm run build
        env:
          # build-time only — the app itself needs none of these
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: neondrive-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: realtime/Dockerfile
          push: false
          tags: neondrive-realtime:ci

  # Deploy is manual + environment-gated: see docs/neon-drive/08-DEPLOYMENT.md
  # (AWS reference architecture — provisioned outside this workflow).
